# Public asset-free Linux/Windows checks; owned game data and GPU acceptance stay local.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  portable:
    name: Development checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical captures and art masters are unnecessary for these tests.
          sparse-checkout: |
            game
            tools
            engine_patches
            manifests
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and verify the pinned official editor
        run: python -B tools/development.py bootstrap
      - name: Require the camera-audit compiler
        run: g++ --version
      - name: Tool regression tests
        run: python -B -m unittest discover -s tools/tests -p 'test_*.py'
      - name: Parity tooling regression tests
        if: '!cancelled()'
        run: python -B -m unittest discover -s tools/parity -p 'test_*.py'
      - name: Translation coverage
        if: '!cancelled()'
        run: python -B tools/check_translations.py
      - name: Issue coverage
        if: '!cancelled()'
        run: python -B tools/check_issue_coverage.py
      - name: Godot test and benchmark script checks
        if: '!cancelled()'
        run: python -c "import sys; from tools import development as d; d.execute([sys.executable, '-B', 'tools/check_test_scripts.py', '--engine', d.godot(), '--import-first', '--timeout', '1500'])"
      - name: Build the native navigation helper on Windows
        if: runner.os == 'Windows' && !cancelled()
        run: python -B tools/development.py native --component navigation --jobs 2
      - name: Verify object identities in the freshly compiled helper
        if: runner.os == 'Windows' && !cancelled()
        run: python -B tools/check_native_identity.py
      - name: Verify the complete Windows engine patch stack
        if: runner.os == 'Windows' && !cancelled()
        run: python -B tools/development.py engine-source --profile windows
